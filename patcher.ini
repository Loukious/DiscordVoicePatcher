; Discord Voice Node Patcher
; Scans discord_voice.node in memory using byte patterns — no RVAs needed.
; On Discord update: restart Discord. Patterns auto-resolve.
; If a pattern breaks after a major update, update it here. No recompile needed.
;
; pattern           = AA BB ?? CC    ; ?? = wildcard byte
; sig_offset        = N              ; bytes from pattern match start to patch site
; alt_pattern       = AA BB ?? CC    ; fallback pattern if primary fails
; alt_offset        = N              ; sig_offset for alt_pattern
; derive_from       = SectionName    ; derive patch site from another section's result
; derive_offset     = 0xN            ; signed byte offset added to the anchor site
; alt_derive_offset = 0xN            ; fallback derive offset
; expected          = AA BB          ; bytes required before primary/derived patching
; patch             = CC DD          ; bytes to write for primary/derived tier
; alt_expected      = AA BB          ; optional expected bytes for alt/derived-alt tier
; alt_patch         = CC DD          ; optional patch bytes for alt/derived-alt tier

; ── Stereo ──────────────────────────────────────────────────────────────────

[EmulateStereoSuccess1]
; CommitAudioCodec: channel count 1 → 2
; Most critical anchor — several patches derive from this
pattern     = E8 ?? ?? ?? ?? BD ?? 00 00 00 80 BC 24 80 01 00 00 01
sig_offset  = 6
alt_pattern = E8 ?? ?? ?? ?? BD ?? 00 00 00 80 BC 24 ?? ?? 00 00 01
alt_offset  = 6
expected    = 01
patch       = 02

[EmulateStereoSuccess2]
; CommitAudioCodec: jne → jmp (always take stereo path)
derive_from       = EmulateStereoSuccess1
derive_offset     = 0xC
alt_derive_offset = 0x1
expected          = 75
patch             = EB

[CreateAudioFrameStereo]
; CreateAudioFrameToProcess: cmovae r13,rcx → mov r13,rcx + nop
; Shared signature across current Stable and Canary builds
pattern     = 49 8B ?? 49 39 ?? 4C 0F 43 ?? 4D 89 ?? 28
sig_offset  = 6
expected    = 4C 0F 43 E9
patch       = 49 89 CD 90

[AudioEncoderOpusConfigSetChannels]
; Stable AudioEncoderOpusConfig constructor: channels 1 → 2
pattern     = 48 B9 14 00 00 00 80 BB 00 00 48 89 08 48 C7 40 ?? ?? 00 00 00
sig_offset  = 17
; Canary constructor is inlined into CommitAudioCodec
alt_pattern = 48 B8 14 00 00 00 80 BB 00 00 48 89 84 24 ?? ?? ?? ?? 48 C7 84 24 ?? ?? ?? ?? 01 00 00 00 48 B8 00 00 00 00 00 7D 00 00
alt_offset  = 26
expected    = 01
patch       = 02

; ── Sample Rate ──────────────────────────────────────────────────────────────

[Emulate48Khz]
; Force the already-selected 48000 Hz path by turning the branch into an unconditional jump
; Stable and Canary use the same one-byte patch but the branch moved by one byte
; Stable: anchor + 0x151, Canary: anchor + 0x152
derive_from       = EmulateStereoSuccess1
derive_offset     = 0x151
alt_derive_offset = 0x152
expected          = 75
patch             = EB

; ── Bitrate ──────────────────────────────────────────────────────────────────

[EmulateBitrateModified]
; CommitAudioCodec bitrate default: 32000 → 384000 bps
; Stable: anchor + 0x45F, Canary: anchor + 0x425
derive_from       = EmulateStereoSuccess1
derive_offset     = 0x45F
alt_derive_offset = 0x425
expected          = 00 7D 00
patch             = 00 DC 05

[HighPassFilter]
; webrtc::AudioProcessingImpl::InitializeHighPassFilter: ret immediately
; Inner signature resolves uniquely on both Stable and Canary
pattern     = 48 8B 42 ?? 45 84 C0 74 ?? 48 85 C0 0F 84 ?? ?? ?? ?? 45 31 F6 48 8D 5C 24 ??
sig_offset  = -30
; Keep known offsets as fallback if the inner signature changes
; Stable: anchor + 0xC275, Canary: anchor + 0xC229
derive_from       = EmulateStereoSuccess1
derive_offset     = 0xC275
alt_derive_offset = 0xC229
expected          = 41
patch             = C3

[SetsBitrateBitrateValue]
; Bitrate setter movabs: 32000 → 384000 bps
pattern     = 89 F8 48 B9 ?? ?? ?? ?? 01 00 00 00 48 09 C1 48 89 4E 1C
sig_offset  = 4
alt_pattern = 89 F8 48 B9 ?? ?? ?? ?? 01 00 00 00 48 09 C1 48 89 ?? ??
alt_offset  = 4
expected    =
patch       = 00 DC 05 00 00

[SetsBitrateBitwiseOr]
; or rcx,rax → NOPs
derive_from   = SetsBitrateBitrateValue
derive_offset = 0x8
expected      = 48 09 C1
patch         = 90 90 90

; ── Encoder Config ────────────────────────────────────────────────────────────

[EncoderConfigInit1]
; AudioEncoderOpusConfig: packed qword 32000 → 384000 bps (first)
; +0xA from AudioEncoderOpusConfigSetChannels on both Stable and Canary
derive_from   = AudioEncoderOpusConfigSetChannels
derive_offset = 0xA
expected      = 00 7D 00 00
patch         = 00 DC 05 00

[EncoderConfigInit2]
; Stable AudioEncoderOpusConfig constructor: packed qword 32000 → 384000 bps (second)
pattern     = 48 B9 ?? ?? ?? ?? ?? ?? ?? ?? 48 89 48 ?? 66 C7 40 ?? 00 00 C6 40 ?? 00
sig_offset  = 6
; Canary constructor layout
alt_pattern = 48 B8 ?? ?? ?? ?? ?? ?? ?? ?? 48 89 41 18 C6 41 20 00 C6 41 21 00 C6 41 22 00 C7 41 24 80 BB 00 00
alt_offset  = 6
expected    = 00 7D 00 00
patch       = 00 DC 05 00

[AudioEncoderOpusConfigIsOk]
; AudioEncoderOpusConfig::IsOk: always return true
; Shared direct signature across Stable and Canary
pattern     = 8B 11 31 C0 85 D2 7E ?? 41 B8 CD CC CC CC 49 89 D1 4D 0F AF C8 49 C1 E9 23
sig_offset  = 0
; Known offsets retained as fallback
; Stable: channel anchor + 0x29C, Canary: channel anchor + 0x3697
derive_from       = AudioEncoderOpusConfigSetChannels
derive_offset     = 0x29C
alt_derive_offset = 0x3697
expected          = 8B 11 31 C0
patch             = 48 C7 C0 01 00 00 00 C3

; ── Downmix / Filters ────────────────────────────────────────────────────────

[MonoDownmixer]
; CapturedAudioProcessor::Process: NOP sled to skip mono downmix gate
pattern     = 48 89 F9 E8 ?? ?? ?? ?? 84 C0 74 0D 83 BE ?? ?? 00 00 09 0F 8F
sig_offset  = 8
alt_pattern = 48 89 ?? E8 ?? ?? ?? ?? 84 C0 ?? ?? 83 ?? ?? ?? 00 00 09 0F 8F
alt_offset  = 8
expected    = 84 C0
patch       = 90 90 90 90 90 90 90 90 90 90 90 90 E9

[ThrowError]
; Environment::Throw: ret immediately
pattern     = 56 56 57 53 48 81 EC C8 00 00 00 0F 29 B4 24 B0 00 00 00 4C 89 CE 4C 89 C7 89 D3
sig_offset  = -1
alt_pattern = 56 56 57 53 48 81 EC ?? ?? 00 00 0F 29 B4 24 ?? ?? 00 00 4C 89 CE 4C 89 C7 89 D3
alt_offset  = -1
expected    = 41
patch       = C3

[DownmixFunc]
; Stable downmix_and_resample
pattern     = 57 41 56 41 55 41 54 56 57 55 53 48 83 EC ?? 48 89 0C 24 45 85 C0
sig_offset  = -1
; Canary equivalent
alt_pattern = 41 57 41 56 41 55 41 54 56 57 55 53 B8 ?? ?? 00 00 E8 ?? ?? ?? ?? 48 29 C4 48 89 D7 48 89 CE
alt_offset  = 0
expected    = 41
patch       = C3

