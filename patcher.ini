; ── Video / Pacing ───────────────────────────────────────────────────────────

[DropFrameBypass]
; VideoStreamEncoder::DropOwingToBandwidth logic
; By forcing the jump, it bypasses the frame drop intentionally saving framerate.
pattern     = E8 ?? ?? ?? ?? 84 C0 74 1F E8 ?? ?? ?? ?? 84 C0 0F 85
sig_offset  = 7
expected    = 74 1F
patch       = EB 1F

[PacerDrainRate]
; UpdateAdjustedMediaRate
; Hardcodes drain rate to 20 Mbps (20000000 = 0x01312D00)
; Stable object layout uses +0x58/+0x60
pattern     = 48 8B 41 58 48 89 41 60 80 79 18 01 0F 85
sig_offset  = 0
expected    = 48 8B 41 58 48 89 41 60
patch       = 48 C7 41 60 00 2D 31 01
; Canary object layout moved the fields to +0x48/+0x50
alt_pattern  = 48 8B 41 48 48 89 41 50 80 79 10 01 0F 85
alt_offset   = 0
alt_expected = 48 8B 41 48 48 89 41 50
alt_patch    = 48 C7 41 50 00 2D 31 01
